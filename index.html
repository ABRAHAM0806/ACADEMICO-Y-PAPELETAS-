<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Incidencias</title>
    <link rel="stylesheet" href="style.css">
</head>
    <script src="script.js"></script>
<body>


<body>

    <h1>Registro de Incidencias</h1>
    <p>Sistema de control académico de maestros</p>

    <div class="contenedor">
<h2>Cargar archivos de Excel</h2>

<label>Archivo de Papeletas:</label>
<input type="file" id="archivoPapeletas" accept=".xlsx,.xls">
        <h2>Datos del maestro</h2>

        <label>Matrícula:</label>
        <input type="text" id="matricula" placeholder="Ingresa la matrícula">

        <label>Nombre del maestro:</label>
        <input type="text" id="nombre" placeholder="Nombre automático" readonly>

        <h2>Registrar incidencia</h2>

        <label>Clave de incidencia:</label>
        <select id="clave">
            <option value="">Selecciona una clave</option>
            <option value="A">A</option>
            <option value="SA">SA</option>
            <option value="EA">EA</option>
            <option value="NA">NA</option>
        </select>

        <label>Fecha:</label>
        <input type="date" id="fecha">

        <label>Descripción:</label>
        <textarea id="descripcion" placeholder="Describe la incidencia"></textarea>

        <button type="button" id="agregar">Agregar incidencia</button>

        <h2>Incidencias registradas</h2>
        <div id="listaIncidencias"></div>

    </div>

</body>


</body>
</html>
